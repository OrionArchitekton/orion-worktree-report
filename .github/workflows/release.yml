name: release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pypi-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify source-pinned release bytes
        run: |
          mkdir dist
          curl --fail --silent --show-error --location --retry 3 -o dist/orion_worktree_report-0.1.0-py3-none-any.whl https://github.com/OrionArchitekton/orion-worktree-report/releases/download/v0.1.0/orion_worktree_report-0.1.0-py3-none-any.whl
          echo "0ed507b4a0d8cb054e355206d8f09867e637df099b135e6cbbba6a5a9a5b5bab  dist/orion_worktree_report-0.1.0-py3-none-any.whl" | sha256sum --check --strict -
          curl --fail --silent --show-error --location --retry 3 -o dist/orion_worktree_report-0.1.0.tar.gz https://github.com/OrionArchitekton/orion-worktree-report/releases/download/v0.1.0/orion_worktree_report-0.1.0.tar.gz
          echo "648f99b38b452f34075ae0a94c6c160b0649257ee071770d9dd95dda08fa554e  dist/orion_worktree_report-0.1.0.tar.gz" | sha256sum --check --strict -
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/orion-worktree-report
    permissions:
      id-token: write
    steps:
      - name: Download and verify the identical bytes without rebuilding
        run: |
          mkdir dist
          curl --fail --silent --show-error --location --retry 3 -o dist/orion_worktree_report-0.1.0-py3-none-any.whl https://github.com/OrionArchitekton/orion-worktree-report/releases/download/v0.1.0/orion_worktree_report-0.1.0-py3-none-any.whl
          echo "0ed507b4a0d8cb054e355206d8f09867e637df099b135e6cbbba6a5a9a5b5bab  dist/orion_worktree_report-0.1.0-py3-none-any.whl" | sha256sum --check --strict -
          curl --fail --silent --show-error --location --retry 3 -o dist/orion_worktree_report-0.1.0.tar.gz https://github.com/OrionArchitekton/orion-worktree-report/releases/download/v0.1.0/orion_worktree_report-0.1.0.tar.gz
          echo "648f99b38b452f34075ae0a94c6c160b0649257ee071770d9dd95dda08fa554e  dist/orion_worktree_report-0.1.0.tar.gz" | sha256sum --check --strict -
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
